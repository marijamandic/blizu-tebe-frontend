<app-navbar
  class="mobile-navbar"
  [isSidebarOpen]="isSidebarOpen"
  (menuClick)="toggleSidebar()">
</app-navbar>

<div class="layout-container">

  <app-sidebar
    [isOpen]="isSidebarOpen"
    class="desktop-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-sidebar>

  <main class="main-content">

    <div class="chat-page">

  <h1 class="page-title">Moji razgovori</h1>

  <div *ngIf="chats.length === 0" class="no-chats">
    Još uvek nemate razgovora.
  </div>

  <div class="chat-list">
    <div
      *ngFor="let chat of chats"
      class="chat-item"
      (click)="openChat(chat)"
    >
      <div class="chat-user">
        <strong>
          {{ userNames[chat.user1Id === userId ? chat.user2Id : chat.user1Id] }}
        </strong>
      </div>

      <div class="chat-post">
        Oglas: {{ postTitles[chat.postId] }}
      </div>
    </div>
  </div>

</div>
</main>
</div>
