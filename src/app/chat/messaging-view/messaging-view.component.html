<app-navbar
  class="mobile-navbar"
  [isSidebarOpen]="isSidebarOpen"
  (menuClick)="toggleSidebar()">
</app-navbar>

<div class="layout-container">

  <app-sidebar
    [isOpen]="isSidebarOpen"
    class="desktop-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-sidebar>

  <main class="main-content">

    <div class="chat-window">

<div class="chat-header">

  <button
    class="back-button"
    (click)="goBack()">
    ←
  </button>

  <div class="chat-header-info" *ngIf="chat">
    <h2>{{ userName }}</h2>
    <a class="post-link" (click)="goToPost()"> {{ postTitle }} </a>
  </div>

  <button *ngIf="canRate" class="rate-button" type="button" (click)="openRating()">
    ⭐ Oceni korisnika
  </button>

</div>
      <div class="messages">

        <ng-container *ngFor="let message of messages; let i = index">

          <div *ngIf="isNewDay(i)" class="message-date">
            {{ formatDate(message.timestamp) }}
          </div>
        
        <div
          class="message"
          [class.my-message]="message.senderId === userId"
          [class.other-message]="message.senderId !== userId">

          <div class="message-content">
            {{ message.content }}

            <div class="message-time">
              {{ message.timestamp | date:'HH:mm' }}
            </div>
          </div>
        </div>
        </ng-container>
      </div>
    

      <div class="message-input">

        <input
          type="text"
          [(ngModel)]="newMessage"
          placeholder="Napišite poruku..."
          (keyup.enter)="sendMessage()">

        <button
          type="button"
          (click)="sendMessage()"
          [disabled]="!newMessage.trim()">
          Pošalji
        </button>

      </div>

    </div>

    <div class="rating-overlay" *ngIf="showRatingModal">

      <div class="rating-modal">

        <button type="button" class="close-rating" (click)="closeRating()">
          ×
        </button>

        <h2>Oceni korisnika</h2>

        <p>Kako ocenjuješ svoju interakciju sa {{ userName }}?</p>

        <div class="stars">
          <button *ngFor="let star of [1, 2, 3, 4, 5]" type="button" class="star" [class.selected]="star <= selectedScore" (click)="selectScore(star)">
            ★
          </button>
        </div>

        <textarea [(ngModel)]="ratingComment" placeholder="Napišite komentar (opciono)..." rows="4">
        </textarea>

        <div class="rating-actions">

          <button type="button" class="cancel-button" (click)="closeRating()">
            Otkaži
          </button>

          <button type="button" class="submit-rating-button" [disabled]="selectedScore === 0" (click)="submitRating()">
            Pošalji ocenu
          </button>

        </div>

      </div>

    </div>

  </main>

</div>
