<app-navbar
  class="mobile-navbar"
  [isSidebarOpen]="isSidebarOpen"
  (menuClick)="toggleSidebar()">
</app-navbar>

<div class="layout-container">
  <app-sidebar
    [isOpen]="isSidebarOpen"
    class="desktop-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-sidebar>

  <main class="main-content">
    <header class="form-header">
      <h1>Dodajte radnu akciju</h1>
    </header>

    <form [formGroup]="requestForm" class="request-form" (ngSubmit)="submit()">

      <label for="title">Naslov *</label>
      <input id="title" formControlName="title" type="text" placeholder="Unesite naslov">

      <label for="description">Opis *</label>
      <textarea id="description" formControlName="description" rows="5" placeholder="Unesite opis"></textarea>

        <label for="createdAt">Datum i vreme održavanja *</label>
        <input id="createdAt" type="datetime-local" formControlName="createdAt">


      <label for="requestType">Tip zahteva *</label>
      <select id="requestType" formControlName="requestType">
        <option value="" disabled>Izaberite tip akcije</option>
        <option value="Donation">Donacija</option>
        <option value="Volunteering">Volontiranje</option>
        <option value="Transport">Transport</option>
        </select>

      <label class="select-label" for="localCommunityId">Mesna zajednica</label>
      <select id="localCommunityId" formControlName="localCommunityId" [disabled]="true">
        <option *ngIf="isLoading" value="">Učitavanje...</option>
        <option *ngFor="let mc of localCommunities" [value]="mc.id">{{ mc.name }}</option>
      </select>
      <p *ngIf="!isLoading && requestForm.get('localCommunityId')?.value" class="info-text">
        Vaša mesna zajednica će biti korišćena za ovaj zahtev.
      </p>

      <label for="picture">Slika</label>
      <input id="picture" type="file" (change)="onFileSelected($event)">
      <div *ngIf="previewUrl" class="image-preview">
        <img [src]="previewUrl" alt="Preview slike">
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn-submit">Dodajte</button>
        <button type="button" class="btn-cancel" (click)="cancel()">Otkažite</button>
      </div>

      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

    </form>
  </main>
</div>
