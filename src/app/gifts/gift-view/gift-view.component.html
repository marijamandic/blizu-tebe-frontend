<app-navbar
  class="mobile-navbar"
  [isSidebarOpen]="isSidebarOpen"
  (menuClick)="toggleSidebar()">
</app-navbar>

<div class="layout-container">
  <app-sidebar
    [isOpen]="isSidebarOpen"
    class="desktop-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-sidebar>

  <main class="main-content" [class.sidebar-open]="isSidebarOpen">
    <div class="announcement-details" *ngIf="gift">
      <div class="request-header">
  <button class="btn-back" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <h1 class="announcement-title">{{ gift.title }}</h1>
</div>
      

      <img
        [src]="'https://localhost:44375/images/gifts/' + gift.attachment"
        alt="Gift image"
        class="announcement-image"
        (error)="onImageError($event)"
      />

      <div class="announcement-info">
        <p class="announcement-dates">
          <mat-icon>event</mat-icon>
        <strong>  Početak: </strong>{{ gift.postDate | date:'shortDate' }} |
        <strong>  Ističe: </strong>{{ gift.expireDate | date:'shortDate' }}
        </p>

        <p class="announcement-description">{{ owner?.name }} {{ owner?.surname }}</p>

        <p class="announcement-description">{{ gift.description }}</p>

        <button
          *ngIf="!isAdminOrOwner"
          (click)="openReportDialog()">
          <mat-icon>flag</mat-icon>
          Prijavi objavu
        </button>

        <div *ngIf="isAdminOrOwner" class="admin-buttons">
    <button class="btn-edit" (click)="editGift(gift.id)">Izmenite</button>
    <button class="btn-delete" (click)="deleteGift(gift.id)">Obrišite</button>
  </div>
      </div>
    </div>
  </main>
</div>
