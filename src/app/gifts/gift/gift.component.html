<app-navbar
  class="mobile-navbar"
  [isSidebarOpen]="isSidebarOpen"
  (menuClick)="toggleSidebar()">
</app-navbar>

<div class="layout-container">
  <app-sidebar
    [isOpen]="isSidebarOpen"
    class="desktop-sidebar"
    [class.mobile-open]="isSidebarOpen">
  </app-sidebar>

  <main class="main-content">
    <header class="request-header">

      <button class="btn-add" (click)="goToAddGift()"> Dodajte poklon </button>
    </header>

    <div class="status-filter">

      <button
          [class.active]="selectedStatus === GiftStatus.Pending"
          (click)="changeStatus(GiftStatus.Pending)">
          Active
      </button>

      <button
          [class.active]="selectedStatus === GiftStatus.Completed"
          (click)="changeStatus(GiftStatus.Completed)">
          Completed
      </button>

      <!-- <button
          [class.active]="selectedStatus === HelpStatus.Expired"
          (click)="changeStatus(HelpStatus.Expired)">
          Expired
      </button> -->

  </div>

  <div class="category-filter">

    <div 
      class="category-item"
      [class.selected]="selectedCategory === null"
      (click)="changeCategory(null)">

      <mat-icon>apps</mat-icon>
      <span>Sve</span>
    </div>

    <div 
      class="category-item"
      *ngFor="let category of categories"
      [class.selected]="selectedCategory === category.value"
      (click)="changeCategory(category.value)">

      <mat-icon>{{category.icon}}</mat-icon>
      <span>
        {{category.name}}
      </span>
    </div>

  </div>

    <div class="request-grid">
      <div *ngFor="let gift of gifts" class="request-card">
        <img
          [src]="gift.attachment ? 'https://localhost:44375/images/Gifts/' + gift.attachment : defaultImage"
          class="request-image"
          alt="{{ gift.title }}"
          (error)="setDefaultImage($event)"
        >

        <div class="request-info">
          <h3 class="request-title">
            {{ gift.title }}
          </h3>

          <p class="request-description">
            {{ gift.description }}
          </p>

          <p class="request-meta">
            <span>
              <mat-icon>category</mat-icon>
              {{ categoryLabels[gift.giftCategory] }}
            </span>

            <span>
              <mat-icon>schedule</mat-icon>
              {{ gift.postDate | date:'short' }}
            </span>
          </p>

          <button
            (click)="goToGift(gift.id)"
            class="btn-more"
          >
            Prikažite više
          </button>
        </div>
      </div>
    </div>

    <div class="pagination" *ngIf="totalPages > 1">

      <button
        [disabled]="page === 1"
        (click)="previousPage()">
        <mat-icon>chevron_left</mat-icon>
        Prethodna
      </button>

      <span class="pagination-info">
        Stranica {{ page }} od {{ totalPages }}
      </span>

      <button
        [disabled]="page === totalPages"
        (click)="nextPage()">
        Sledeća
        <mat-icon>chevron_right</mat-icon>
      </button>
  </div>
  </main>
</div>
